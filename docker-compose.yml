services:
  node:
    build:
      dockerfile: docker/node/Dockerfile
      context: .
      args:
        - UID=${UID}
    restart: unless-stopped
    user: ${UID}:${UID}
    ports:
      - ${APP_MAPPED_PORT:-8080}:8080
    entrypoint: npm
    command: run dev --host
    volumes:
      - ./:/home/node/app

